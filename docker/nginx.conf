# Static file server for the built client SPA.
#
# TLS and public hosting are expected to be handled by an upstream reverse
# proxy, so this only speaks plain HTTP on the unprivileged image's default 8080.

server {
	listen 8080;
	server_name _;

	root /usr/share/nginx/html;
	index index.html;

	# Container healthcheck target.
	location = /healthz {
		access_log off;
		default_type text/plain;
		return 200 "ok\n";
	}

	# Vite emits content-hashed filenames under /assets, so these are safe to
	# cache forever. A new build produces new filenames, which busts the cache.
	location /assets/ {
		add_header Cache-Control "public, max-age=31536000, immutable";
		try_files $uri =404;
	}

	# Never cache the entry document, otherwise clients keep loading the old
	# bundle after a deploy.
	location = /index.html {
		add_header Cache-Control "no-cache";
	}

	# TanStack Router generates real paths such as /directory, so an unknown
	# path is a client-side route, not a missing file. Without this fallback
	# every deep link and page refresh would 404.
	location / {
		try_files $uri $uri/ /index.html;
	}
}
