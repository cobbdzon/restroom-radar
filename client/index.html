<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Student ratings for every restroom at Mapúa University, Intramuros. Check the building, floor, amenities, and what you're walking into."
    />
    <meta name="theme-color" content="#17332c" />
    <title>Restroom Radar</title>

    <!-- Apply a saved theme before first paint; otherwise follow the OS. -->
    <script>
      (() => {
        try {
          const saved = localStorage.getItem("theme");
          if (saved === "light" || saved === "dark") {
            document.documentElement.dataset.theme = saved;
          }
        } catch {
          /* Storage can be unavailable; fall back to the OS setting. */
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/radar.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Open Graph. og:url is env-driven: set VITE_SITE_URL (no trailing
         slash) to a canonical origin so social embeds get an absolute URL,
         e.g. VITE_SITE_URL=https://restroom-radar.example.com -->
    <meta property="og:site_name" content="Restroom Radar" />
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Restroom Radar — campus restroom ratings, reviewed by students"
    />
    <meta
      property="og:description"
      content="Student ratings for every restroom at Mapúa University, Intramuros. Check the building, floor, amenities, and what you're walking into."
    />
    <meta property="og:url" content="__SITE_URL__" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Restroom Radar — campus restroom ratings, reviewed by students"
    />
    <meta
      name="twitter:description"
      content="Student ratings for every restroom at Mapúa University, Intramuros. Check the building, floor, amenities, and what you're walking into."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
