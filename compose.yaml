# Local demo stack for Restroom Radar.
#
# One service: the client SPA served as static files. There is no API container
# because the demo is read-only and runs on client-side mock data.
#
# The published port binds to all interfaces so an upstream reverse proxy can
# reach it over the LAN. TLS and public hosting are expected to be handled by
# that proxy, not by this container.
#
#   docker compose up --build
#
# Override the published port with CLIENT_PORT:
#
#   CLIENT_PORT=3000 docker compose up --build
#
# Set VITE_SITE_URL in the project .env (read automatically by compose) to have
# the client build embed an absolute og:url for social embeds. The value is
# baked in at build time, so change it and rebuild:
#
#   VITE_SITE_URL=https://restroom-radar.example.com docker compose up --build

services:
  client:
    build:
      context: .
      dockerfile: docker/Dockerfile.client
      args:
        # Baked into index.html as og:url during the client build (see
        # vite.config.ts). Empty when unset -> the tag is omitted.
        VITE_SITE_URL: ${VITE_SITE_URL:-}
    ports:
      - "${CLIENT_PORT:-8080}:8080"
    restart: unless-stopped
